<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Cover Letter Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>AI Cover Letter Generator</h1>

    <input type="text" id="name" placeholder="Your Name">

    <input type="text" id="role" placeholder="Job Role">

    <input type="text" id="company" placeholder="Company Name">

    <textarea id="job" placeholder="Paste Job Description Here"></textarea>

    <input type="file" id="resume" accept=".pdf">

    <button onclick="generate()">Generate Cover Letter</button>

    <p id="loading"></p>

    <textarea id="output" placeholder="Your cover letter will appear here..."></textarea>

    <button onclick="copyText()">Copy to Clipboard</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
